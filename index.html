<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公众号文章阅读器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>📰 公众号文章阅读器</h1>
      <div class="header-info">
        <span id="update-time"></span>
        <span id="total-stats"></span>
      </div>
    </header>

    <div class="main-container">
      <!-- 左侧栏 - 公众号列表 -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <input type="text" id="search-input" placeholder="🔍 搜索公众号...">
        </div>
        <div class="sidebar-tabs">
          <button class="stab active" data-filter="all">全部</button>
          <button class="stab" data-filter="hits">有命中</button>
        </div>
        <div id="account-list" class="account-list"></div>
      </aside>

      <!-- 右侧主区域 -->
      <main class="content">
        <div id="welcome" class="welcome">
          <h2>📖 点击左侧公众号查看文章</h2>
          <p id="welcome-stats"></p>
        </div>
        <div id="article-header" class="article-header hidden">
          <h2 id="current-source"></h2>
          <span id="article-count"></span>
        </div>
        <div id="article-list" class="article-list"></div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
